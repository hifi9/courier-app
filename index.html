function shrink(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);

function ringOnce(){if(!ac)return;const t=ac.currentTime;[880,1175,880,1175].forEach((f,i)=>beep(f,t+i*.16,.14));}
function chime(){if(!ac)return;const t=ac.currentTime;beep(660,t,.25,.12);beep(990,t+.18,.35,.12);}

const ICON_POWER=c=>`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>`;

function slider(host,{label,cls,icon,onDone}){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="slide ${cls}"><div class="slide-label">${label}<span class="chev">‹‹</span></div><div class="knob">${icon}</div></div>`;
  host.appendChild(wrap);
  const track=wrap.firstChild,knob=track.querySelector('.knob'),lab=track.querySelector('.slide-label');
  let sx=null,max=0,dx=0,locked=false;
  const reset=()=>{knob.style.transition='transform .22s';knob.style.transform='';lab.style.opacity=1;track.classList.remove('wait');locked=false;};
  knob.addEventListener('pointerdown',e=>{if(locked)return;unlockAudio();sx=e.clientX;max=track.clientWidth-knob.offsetWidth-12;knob.setPointerCapture(e.pointerId);knob.style.transition='none';});
  knob.addEventListener('pointermove',e=>{if(sx===null)return;dx=Math.min(0,Math.max(-max,e.clientX-sx));knob.style.transform=`translateX(${dx}px)`;lab.style.opacity=1-Math.abs(dx)/max;});
  const end=async()=>{if(sx===null)return;sx=null;knob.style.transition='transform .22s';
    if(Math.abs(dx)>max*.7){knob.style.transform=`translateX(${-max}px)`;locked=true;track.classList.add('wait');
      try{await onDone();}catch(e){toast(e.message,true);reset();}}
    else reset();dx=0;};
  knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',end);
}

    <div class="pc"><div style="display:flex;justify-content:space-between;color:#64748b;margin-bottom:12px"><b style="color:var(--ink)">📅 החודש</b><span id="monthName"></span></div>
    <div class="sum"><div><b id="hCount">0</b><span>משלוחים החודש</span></div><div><b id="hTotal">₪0</b><span>הכנסות ממשלוחים</span></div></div></div><div id="hList"></div></div>
  <div class="page" id="profile"><div class="ph">פרופיל<button data-back>✕</button></div>
    <div class="pc" style="display:flex;flex-direction:column;gap:2px">
      <div class="t1">פרטים אישיים</div>
      <label class="lbl" for="pName">שם מלא</label><input class="inp" id="pName" autocomplete="name">
      <label class="lbl" for="pPhone">טלפון</label><input class="inp" id="pPhone" inputmode="tel" autocomplete="tel" placeholder="050-0000000">
      <label class="lbl" for="pVehicle">כלי רכב</label>
      <select class="inp" id="pVehicle"><option>אופניים חשמליים</option><option>קטנוע</option><option>אופנוע</option><option>רכב</option></select>
    </div>
    <div class="pc" style="display:flex;flex-direction:column;gap:2px">
      <div class="t1">פרטי העסק</div>
      <label class="lbl" for="pBiz">שם העסק</label><input class="inp" id="pBiz" placeholder="לדוגמה: רועי משלוחים">
      <label class="lbl" for="pBizNo">מספר עוסק / ח.פ · לחשבונית</label><input class="inp" id="pBizNo" inputmode="numeric">
      <button class="bookbtn" id="pSave" style="margin-top:16px">שמירה</button>
    </div>
  <div class="page" id="upcoming"><div class="ph">משלוחים מתוכננים<button data-back>✕</button></div><div class="pc t2" style="padding:12px 16px">כל משלוח יוצע לך עם צלצול 45 דק׳ לפני תחילת החלון שלו</div><div id="uList"></div></div>
  <div class="page" id="earnings"><div class="ph">הכנסות<button data-back>✕</button></div>
    <div class="pc"><div style="color:#64748b;margin-bottom:6px">היום</div><div class="big" id="eToday">₪0.00</div>
    <div class="sum" style="margin-top:14px"><div><b id="eCount">0</b><span>משלוחים</span></div><div><b id="eAvg">₪0</b><span>ממוצע למשלוח</span></div><div><b id="eHours">0:00</b><span>שעות מחובר</span></div></div></div>
    <div class="pc"><b>7 הימים האחרונים</b><div class="bars" id="bars"></div></div></div>`;

  const S={me:null,active:null,offer:null,today:{count:0,total:0},shown:null,dismissed:new Set(),pos:null,watch:null,wake:null,viewKey:null,fitKey:null,timer:null};

  /* map */
  const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(HOME,14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const dotIcon=(bg,html,sz=34)=>L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};border:3px solid #fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px #0008">${html}</div>`});
  const meM=L.marker(HOME,{icon:dotIcon('#3b82f6','',26),zIndexOffset:1000});
  const restM=L.marker(HOME,{icon:dotIcon('#f97316','🍽️')}),custM=L.marker(HOME,{icon:dotIcon('#3b82f6','🏠')});
  const line=L.polyline([],{color:'#f97316',weight:5,dashArray:'8 10',opacity:.9}).addTo(map);
  function drawMap(){
    const me=S.pos||(S.me&&S.me.lat?[S.me.lat,S.me.lng]:null);
    if(me){meM.setLatLng(me).addTo(map);}
    const o=S.active;
    if(o){restM.setLatLng([o.restaurant.lat,o.restaurant.lng]).addTo(map);custM.setLatLng([o.cust_lat,o.cust_lng]).addTo(map);
      const target=['to_rest','at_rest'].includes(o.status)?[o.restaurant.lat,o.restaurant.lng]:[o.cust_lat,o.cust_lng];
      line.setLatLngs(me?[me,target]:[]);
      const fk=o.id+o.status;if(S.fitKey!==fk){S.fitKey=fk;const pts=[target];if(me)pts.push(me);map.fitBounds(L.latLngBounds(pts).pad(.6),{paddingBottomRight:[0,260]});}
    }else{restM.remove();custM.remove();line.setLatLngs([]);if(S.fitKey){S.fitKey=null;if(me)map.setView(me,15);}}
  }
  $('#locBtn').onclick=()=>{const me=S.pos||(S.me&&S.me.lat?[S.me.lat,S.me.lng]:null);if(me)map.setView(me,16);else{startGeo();toast('מחפש מיקום…');}};

  /* geolocation + wake lock */
  function startGeo(){if(S.watch||!navigator.geolocation)return;
    S.watch=navigator.geolocation.watchPosition(p=>{S.pos=[p.coords.latitude,p.coords.longitude];drawMap();},
      e=>{if(e.code===1)toast('צריך לאשר גישה למיקום בהגדרות הדפדפן',true);},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
  function stopGeo(){if(S.watch!=null){navigator.geolocation.clearWatch(S.watch);S.watch=null;}}
  async function keepAwake(on){try{if(on&&'wakeLock' in navigator){S.wake=await navigator.wakeLock.request('screen');}else if(!on&&S.wake){await S.wake.release();S.wake=null;}}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.me&&S.me.is_online)keepAwake(true);poll();}});

  /* polling */
  async function poll(){
    clearTimeout(S.timer);
    try{
      const d=await rpc('c_poll',{t:TOKEN,p_lat:S.pos?S.pos[0]:null,p_lng:S.pos?S.pos[1]:null});
      $('#net').style.display='none';
      const prevActive=S.active;
      S.me=d.me;S.active=d.active;S.offer=d.offer;S.today=d.today;S.upcoming=d.upcoming||[];
      if(prevActive&&!S.active&&!S.justDelivered)toast('המשלוח בוטל או הסתיים');
      S.justDelivered=false;
      render();
    }catch(e){if(e.code==='bad_token'){gate('הקישור האישי לא תקין. בקש קישור חדש.');return;}$('#net').style.display='block';}
    S.timer=setTimeout(poll,S.me&&S.me.is_online?3000:15000);
  }

  function render(){
    const on=!!(S.me&&S.me.is_online);
    ['#dot','#dot2'].forEach(s=>$(s).classList.toggle('on',on));
    $('#status').textContent=$('#status2').textContent=on?'מחובר':'מנותק';
    $('#earnPill').textContent=ils(S.today.total);
    if(S.me){$('#meName').textContent=S.me.name;$('#avName').textContent=S.me.name.slice(0,1);}
    const key=(S.active?S.active.id+S.active.status:(on?'on':'off'))+'|'+(S.upcoming||[]).length+'|'+(S.pushOn?1:0);
    if(key!==S.viewKey){S.viewKey=key;renderSheet();}
    /* offer handling */
    const o=S.offer;
    if(o&&!S.active&&o.id!==S.shown&&!S.dismissed.has(o.id))showOffer(o);
    else if(S.shown&&(!o||o.id!==S.shown)&&!S.accepting){closeOffer();toast('ההזמנה כבר לא זמינה');}
    drawMap();
  }

  function renderSheet(){
    const sh=$('#sheet');sh.innerHTML='';
    if(S.active){renderActive(sh);return;}
    if(pushOK()&&!S.pushOn){
      const bb=document.createElement('button');bb.className='b dark';bb.style.cssText='width:100%;height:52px;margin-bottom:12px;font-size:17px;background:#fff;color:var(--ink);box-shadow:0 4px 14px #0006';
      bb.textContent=Notification.permission==='denied'?'🔕 התראות חסומות · פתח הגדרות האתר ואשר':'🔔 הפעל התראות · לקבל הזמנות גם כשהאפליקציה סגורה';
      bb.onclick=async()=>{unlockAudio();const ok=await enablePush(true);S.pushOn=ok;if(ok){toast('התראות הופעלו');S.viewKey=null;render();}else toast(pushErr||'לא הצלחתי להפעיל התראות',true);bb.textContent='⚠️ '+(pushErr||'שגיאה')+' · נסה שוב';};
      sh.appendChild(bb);
    }
    if(S.me&&S.me.is_online){
      sh.insertAdjacentHTML('beforeend','<div class="waiting"><span class="spin"></span>ממתין להזמנות · המסך יישאר דלוק</div>');
      if((S.upcoming||[]).length){const u=document.createElement('button');u.className='waiting';u.style.cssText='border:0;color:#fff;font:700 15px Heebo,sans-serif;cursor:pointer';
        u.textContent=`📅 ${S.upcoming.length} משלוחים מתוכננים · הצג`;u.onclick=()=>{renderUpcoming();$('#upcoming').classList.add('show');};sh.appendChild(u);}
      slider(sh,{label:'החלק כדי להתנתק',cls:'stop',icon:ICON_POWER('#ef4444'),onDone:async()=>{await rpc('c_set_online',{t:TOKEN,p_online:false});stopGeo();keepAwake(false);S.viewKey=null;await poll();}});
    }else{
      slider(sh,{label:'החלק כדי להתחבר',cls:'go',icon:ICON_POWER('#22c55e'),onDone:async()=>{await rpc('c_set_online',{t:TOKEN,p_online:true});startGeo();keepAwake(true);chime();enablePush(true).then(ok=>{S.pushOn=ok;if(ok){S.viewKey=null;render();}if(!ok&&pushOK()&&Notification.permission==='denied')toast('התראות חסומות · אפשר אותן בהגדרות כדי לקבל הזמנות גם במסך נעול',true);});S.viewKey=null;toast('מחובר · הזמנות יגיעו עם צליל');await poll();}});
    }
  }

  /* offer */
  function showOffer(o){
    S.shown=o.id;const C=2*Math.PI*30;
    const dist=S.pos?km(S.pos[0],S.pos[1],o.restaurant.lat,o.restaurant.lng).toFixed(1):null;
    $('#offer').innerHTML=`
     <div class="row"><div class="ring"><svg width="70" height="70"><circle cx="35" cy="35" r="30" stroke="#e5e7eb" stroke-width="6" fill="none"/><circle id="arc" cx="35" cy="35" r="30" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="secs">30</b></div>
      <div style="margin-inline-start:auto;text-align:left"><div class="t2">הזמנה חדשה</div><div class="big">${ils(o.price)}</div></div></div>
     <div class="hr"></div>
     <div class="stop2"><span class="pin" style="background:#f97316"></span><div><div class="t1">${esc(o.restaurant.name)}</div><div class="t2">${esc(o.restaurant.address)}${dist?` · ${dist} ק״מ ממך`:''}</div></div></div>
     <div class="stop2"><span class="pin" style="background:#3b82f6"></span><div><div class="t1">${esc(o.cust_address)}</div><div class="t2">${esc(o.size||'')}</div></div></div>
     <div class="t2" style="margin-top:4px">📍 ${o.km} ק״מ${o.ready?(o.window_start?' · 📅 חלון '+esc(o.ready):' · ⏱️ מוכן '+esc(o.ready)):''}</div>
     ${o.note?`<div class="t2" style="margin-top:4px">📝 ${esc(o.note)}</div>`:''}
     <div class="btns"><button class="b decline" id="dec">דחה</button><button class="b accept" id="acc">קבל הזמנה</button></div>`;
    $('#offerOv').classList.add('show');startRing();
    let left=30;clearInterval(S.cd);
    S.cd=setInterval(()=>{left--;const s=$('#secs');if(!s)return;s.textContent=left;$('#arc').setAttribute('stroke-dashoffset',C*(1-left/30));if(left<=10)$('#arc').setAttribute('stroke','#ef4444');if(left<=0)decline(o);},1000);
    $('#acc').onclick=async()=>{S.accepting=true;$('#acc').disabled=true;
      try{const a=await rpc('c_accept',{t:TOKEN,p_id:o.id});closeOffer();S.active=a;S.viewKey=null;render();}
      catch(e){toast(e.message,true);closeOffer();S.dismissed.add(o.id);}
      S.accepting=false;poll();};
    $('#dec').onclick=()=>decline(o);
  }
  async function decline(o){S.dismissed.add(o.id);closeOffer();try{await rpc('c_decline',{t:TOKEN,p_id:o.id});}catch(e){}}
  function closeOffer(){clearInterval(S.cd);stopRing();$('#offerOv').classList.remove('show');S.shown=null;}

  /* active */
  const STEPS={to_rest:[0,'בדרך למסעדה','הגעתי למסעדה'],at_rest:[1,'במסעדה · איסוף','אספתי את ההזמנה'],to_cust:[2,'בדרך ללקוח','הגעתי ללקוח'],at_cust:[3,'אצל הלקוח','המשלוח נמסר']};
  function renderActive(sh){
    const o=S.active,[i,tag,btn]=STEPS[o.status],atRest=i<2;
    const lat=atRest?o.restaurant.lat:o.cust_lat,lng=atRest?o.restaurant.lng:o.cust_lng;
    const addr=atRest?o.restaurant.address:o.cust_address,title=atRest?o.restaurant.name:('לקוח'+(o.cust_name?': '+o.cust_name:''));
    const phone=atRest?o.restaurant.phone:o.cust_phone;
    sh.insertAdjacentHTML('beforeend',`<div class="card">
      <div class="steps">${[0,1,2,3].map(k=>`<i class="${k<=i?'done':''}"></i>`).join('')}</div>
      <span class="tag">${tag}</span>
      <div class="row"><div class="ic ${atRest?'':'blue'}">${atRest?'🍽️':'🏠'}</div><div><div class="t1">${esc(title)}</div><div class="t2">${esc(addr)}</div></div><div class="money">${ils(o.price)}</div></div>
      <div class="hr"></div><div class="t2">${esc(o.size||'')} · ${o.km} ק״מ${o.window_start?' · 📅 '+esc(o.ready):''}${o.note?' · 📝 '+esc(o.note):''}</div>
      <div class="btns"><a class="b dark" href="https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes" target="_blank" rel="noopener">🧭 ניווט ב-Waze</a>
      ${phone?`<a class="b light" href="tel:${esc(phone)}">📞 ${atRest?'מסעדה':'לקוח'}</a>`:`<button class="b light" disabled style="opacity:.5">📞 אין מספר</button>`}</div></div>`);
    if(!atRest){
      const done=o.photo_url||(S.photoDone&&S.photoDone[o.id]);
      sh.lastElementChild.insertAdjacentHTML('beforeend',`<label class="b ${done?'light':'dark'}" style="margin-top:10px;cursor:pointer;height:50px">${done?'✓ תמונת מסירה נשמרה · צלם שוב':'📷 צילום מסירה'}<input type="file" accept="image/*" capture="environment" id="podIn" style="display:none"></label>`);
      $('#podIn').onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
        toast('מעלה תמונה…');
        try{const blob=await shrink(f);const fd=new FormData();fd.append('t',TOKEN);fd.append('order',o.id);fd.append('file',blob,'pod.jpg');
          const r=await fetch(SB_URL+'/functions/v1/delivery-photo',{method:'POST',headers:{apikey:SB_KEY},body:fd});
          if(!r.ok)throw new Error();S.photoDone=S.photoDone||{};S.photoDone[o.id]=true;toast('התמונה נשמרה · העסק יכול לשלוח ללקוח');S.viewKey=null;render();}
        catch(err){toast('העלאת התמונה נכשלה',true);}};
    }
    slider(sh,{label:btn,cls:'step',icon:ICON_ARROW('#f97316'),onDone:async()=>{
      const n=await rpc('c_advance',{t:TOKEN,p_id:o.id});
      if(n.status==='delivered'){S.justDelivered=true;S.active=null;chime();toast('המשלוח נמסר · +'+ils(n.price));}else S.active=n;
      S.viewKey=null;render();poll();}});
  }

  function renderUpcoming(){
    const U=S.upcoming||[];
    $('#uList').innerHTML=U.length?U.map(o=>`<div class="pc"><div class="row"><div class="ic">📅</div><div><div class="t1">${esc(o.ready||'')}</div><div class="t2">${esc(o.restaurant.name)} → ${esc(o.cust_address)}</div></div><div class="money">${ils(o.price)}</div></div><div class="hr"></div><div class="t2">${o.km} ק״מ · ${esc(o.size||'')} · יוצע ב-${hhmm(new Date(new Date(o.window_start)-45*60000))}</div></div>`).join(''):'<div class="empty">אין משלוחים מתוכננים</div>';
  }
  /* drawer & pages */
  $('#menuBtn').onclick=()=>$('#drawerWrap').classList.add('open');
  $('#drawerBg').onclick=()=>$('#drawerWrap').classList.remove('open');
  document.querySelectorAll('.nav').forEach(n=>n.onclick=async()=>{$('#drawerWrap').classList.remove('open');const g=n.dataset.go;if(g==='home')return;$('#'+g).classList.add('show');await renderPage(g);});
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>b.closest('.page').classList.remove('show'));
  async function renderProfile(){
    try{const p=await rpc('c_profile_get',{t:TOKEN});
      $('#pName').value=p.name||'';$('#pPhone').value=p.phone||'';$('#pBiz').value=p.business_name||'';$('#pBizNo').value=p.business_number||'';
      if(p.vehicle){const s=$('#pVehicle');if(![...s.options].some(o=>o.text===p.vehicle))s.add(new Option(p.vehicle));s.value=p.vehicle;}
    }catch(e){toast(e.message,true);}
  }
  $('#pSave').onclick=async()=>{
    $('#pSave').disabled=true;
    try{await rpc('c_profile_set',{t:TOKEN,p_name:$('#pName').value,p_phone:$('#pPhone').value,p_vehicle:$('#pVehicle').value,p_business_name:$('#pBiz').value,p_business_number:$('#pBizNo').value});
      toast('הפרטים נשמרו');poll();}catch(e){toast(e.code==='name_required'?'צריך למלא שם':e.message,true);}
    $('#pSave').disabled=false;
  };
  async function renderPage(g){
    if(g==='profile'){await renderProfile();return;}
    let H=[];try{H=await rpc('c_history',{t:TOKEN});}catch(e){toast(e.message,true);}
    const now=new Date();
    if(g==='history'){
      const mon=H.filter(h=>new Date(h.delivered_at).getMonth()===now.getMonth());
      $('#monthName').textContent=now.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
      $('#hCount').textContent=mon.length;$('#hTotal').textContent=ils(mon.reduce((a,h)=>a+ +h.price,0));
      $('#hList').innerHTML=H.length?H.map(h=>{const mins=Math.max(1,Math.round((new Date(h.delivered_at)-new Date(h.accepted_at))/60000));
        return `<div class="pc"><div class="row"><div class="ic">🍽️</div><div><div class="t1">${esc(h.restaurant.name)}</div><div class="t2">${new Date(h.delivered_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div><div class="money">${ils(h.price)}</div></div><div class="hr"></div><div class="t2">🕒 ${mins} דק׳</div><div class="t2" style="margin-top:4px">📍 ${esc(h.cust_address)}</div></div>`;}).join(''):'<div class="empty">עדיין אין משלוחים</div>';
    }
    if(g==='earnings'){
      const day=d=>new Date(d).toDateString(),td=H.filter(h=>day(h.delivered_at)===now.toDateString()),tot=td.reduce((a,h)=>a+ +h.price,0);
      $('#eToday').textContent=ils(tot);$('#eCount').textContent=td.length;$('#eAvg').textContent=td.length?'₪'+(tot/td.length).toFixed(1):'₪0';
      const secs=(S.me&&S.me.online_seconds_today)||0,mm=Math.floor(secs/60);$('#eHours').textContent=Math.floor(mm/60)+':'+String(mm%60).padStart(2,'0');
      const days=['א','ב','ג','ד','ה','ו','ש'],vals=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);vals.push([d,H.filter(h=>day(h.delivered_at)===d.toDateString()).reduce((a,h)=>a+ +h.price,0)]);}
      const mx=Math.max(1,...vals.map(v=>v[1]));
      $('#bars').innerHTML=vals.map(([d,v],i)=>`<div class="${i===6?'today':''}"><span>${Math.round(v)}</span><i style="height:${Math.max(4,v/mx*95)}px"></i>${i===6?'היום':days[d.getDay()]}</div>`).join('');
    }
  }
  enablePush(false).then(ok=>{S.pushOn=ok;if(ok){S.viewKey=null;render();}});
  poll();
}

function restaurantApp(){
  $('#app').innerHTML=`<div class="rest">
    <div class="rh"><div class="logo" id="rLogo">•</div><div><div class="t1" id="rName0">…</div><div class="t2" id="rAddr0"></div></div><div class="cstat"><span class="dot" id="cDot"></span><span id="cTxt">שליח</span></div></div>
    <button class="bookbtn" id="bellBtn" style="display:none;width:auto;height:46px;font-size:16px;margin:0 14px 12px;padding:0 16px;background:var(--ink);width:calc(100% - 28px)">🔔 הפעל התראות על המשלוחים</button>
    <div class="rcard">
      <div class="t1" style="font-size:20px">הזמנת שליח</div>
      <div class="lbl">כתובת הלקוח</div>
      <div class="addr"><input class="inp" id="fAddr" placeholder="רחוב, מספר, עיר" autocomplete="off" enterkeyhint="search"><button class="srch" id="fSearch">חפש</button></div>
      <div class="sugg" id="sugg"></div><div class="picked" id="picked"></div>
      <div id="recentBox" style="display:none;margin-top:10px"><div class="t2" style="font-size:13px;margin-bottom:6px">כתובות קבועות</div><div class="chips" id="recent" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
      <div class="two"><div><div class="lbl">שם הלקוח</div><input class="inp" id="fName" placeholder="שם"></div><div><div class="lbl">טלפון</div><input class="inp" id="fPhone" inputmode="tel" placeholder="050-0000000"></div></div>
      <div class="lbl">גודל המשלוח</div><div class="seg" id="sizeSeg"></div>
      <div id="readyBox"><div class="lbl">מוכן לאיסוף</div><div class="seg" id="readySeg"></div></div>
      <div id="winBox" style="display:none"><div class="lbl">יום משלוח</div><div class="seg" id="daySeg"></div>
        <div class="lbl" id="winLbl">חלון משלוח</div><div class="seg" id="winSeg" style="flex-wrap:wrap"></div></div>
      <div class="lbl">הערה לשליח</div><input class="inp" id="fNote" placeholder="קומה, קוד כניסה…">
      <div class="price"><span class="t2">עלות משלוח</span><b id="fPrice" style="font-size:20px">—</b></div>
      <button class="bookbtn" id="bookBtn">הזמן שליח</button>
    </div>
    <div class="sec">משלוחים פעילים</div><div id="rActive"></div>
    <div class="sec">הושלמו היום</div><div id="rDone"></div>
  </div>`;
  const F={lat:null,lng:null,addr:'',city:'',size:'שקית אחת',ready:'עכשיו',day:null,win:null};
  let WIN=null; // restaurant delivery-window settings, when it has them
  const DAYN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const at=(d,hm)=>{const [H,M]=hm.split(':').map(Number);const x=new Date(d);x.setHours(H,M,0,0);return x;};
  function zoneWindows(){if(!WIN)return [];const nz=s=>String(s).replace(/[־\-–]/g,' ').replace(/\s+/g,' ');const c=nz((F.city||'')+' '+(F.addr||''));
    const z=(WIN.zones||[]).find(z=>(z.match||[]).some(m=>c.includes(nz(m))));return {label:z?z.label:'',list:z?z.windows:(WIN.default_windows||[])};}
  function availDays(){const out=[],now=new Date(),closed=WIN.closed_days||[];
    for(let i=0;out.length<3&&i<8;i++){const d=new Date(now);d.setDate(now.getDate()+i);d.setHours(0,0,0,0);if(closed.includes(d.getDay()))continue;
      const ws=zoneWindows().list.filter(w=>at(d,w.split('-')[1])-now>=45*60000);if(!ws.length)continue;
      out.push({d,label:i===0?'היום':i===1?'מחר':'יום '+DAYN[d.getDay()],ws});}
    return out;}
  function renderWin(){
    if(!WIN)return;
    const days=availDays();F.day=days.find(x=>F.day&&x.d.getTime()===F.day.d.getTime())||days[0]||null;
    $('#daySeg').innerHTML=days.map((x,i)=>`<button data-i="${i}" class="${F.day&&x.d.getTime()===F.day.d.getTime()?'on':''}">${x.label}</button>`).join('')||'<span class="t2">אין ימי משלוח זמינים</span>';
    $('#daySeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{F.day=days[+b.dataset.i];F.win=null;renderWin();});
    const z=zoneWindows();$('#winLbl').textContent='חלון משלוח'+(z.label?' · '+z.label:'');
    const ws=F.day?F.day.ws:[];if(!ws.includes(F.win))F.win=null;
    $('#winSeg').innerHTML=ws.map(w=>`<button dir="ltr" style="flex:1 0 30%" class="${F.win===w?'on':''}">${w.replace('-','–')}</button>`).join('');
    $('#winSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{F.win=b.textContent.replace('–','-');renderWin();});
  }
  let me=null,last={},timer=null;
  const ST={searching:['מחפש שליח…',0,'#64748b'],to_rest:['שליח בדרך אליכם',1,'#f97316'],at_rest:['השליח במסעדה',2,'#f97316'],to_cust:['בדרך ללקוח',3,'#3b82f6'],at_cust:['אצל הלקוח',4,'#3b82f6'],delivered:['נמסר ✓',5,'#16a34a']};

  function seg(id,opts,key){const el=$(id);el.innerHTML=opts.map(v=>`<button class="${F[key]===v?'on':''}">${v}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{F[key]=b.textContent;seg(id,opts,key);});}
  seg('#sizeSeg',['שקית אחת','2 שקיות','גדול'],'size');seg('#readySeg',['עכשיו','10 דק׳','20 דק׳'],'ready');

  /* address search (Nominatim, on demand only) */
  async function search(){
    unlockAudio();
    const q=$('#fAddr').value.trim();if(q.length<3){toast('הקלידו כתובת מלאה',true);return;}
    $('#fSearch').textContent='…';
    try{
      const nomi=async s=>(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&accept-language=he&addressdetails=1&limit=6&q='+encodeURIComponent(s))).json();
      const num=(q.match(/\d+[א-ת]?/)||[])[0];
      let res=await nomi(q);
      if(!res.length&&num)res=await nomi(q.replace(num,' ').replace(/\s+/g,' ').trim());
      // street missing from the free map: fall back to the city's location, keep the typed address for the courier and Waze
      if(!res.length){
        const CITIES=['תל אביב','הרצליה','רמת השרון','הרצליה','רעננה','כפר סבא','הוד השרון','רמת גן','גבעתיים','פתח תקווה','חולון','בת ים','בני ברק','ראשון לציון','נתניה','כפר שמריהו'];
        const found=CITIES.find(c=>q.replace(/[-־]/g,' ').includes(c));
        const home=((me&&me.address)||'').split(',').pop().trim();
        const opts=found?[found]:[...new Set([home,'תל אביב','הרצליה'].filter(Boolean))];
        for(const city of opts){const cr=await nomi(city);if(cr.length){const r=cr[0];r._approx=true;r._cityName=city;r._typed=found?q:q+', '+city;res.push(r);}}
      }
      const box=$('#sugg');
      if(!res.length){box.style.display='block';box.innerHTML='<div style="color:#94a3b8">לא נמצא · נסו להוסיף עיר</div>';return;}
      const seen=new Set();
      box.innerHTML=res.map((r,i)=>{if(r._approx){r._city=r._cityName;return `<div data-i="${i}">📍 ${esc(r._typed)} <span style="color:#94a3b8">· מיקום משוער לפי העיר</span></div>`;}
        const a=r.address||{};const nice=[[a.road,a.house_number||(a.road?num:'')].filter(Boolean).join(' '),a.city||a.town||a.village||a.suburb].filter(Boolean).join(', ')||r.display_name;
        if(seen.has(nice))return '';seen.add(nice);r._city=a.city||a.town||a.village||'';return `<div data-i="${i}">${esc(nice)}</div>`;}).join('');
      box.style.display='block';
      box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const r=res[+el.dataset.i];pick(r,r._approx?r._typed:el.textContent);});
    }catch(e){toast('חיפוש הכתובת נכשל',true);}
    finally{$('#fSearch').textContent='חפש';}
  }
  async function pick(r,nice){
    F.lat=+r.lat;F.lng=+r.lon;F.addr=nice;F.city=r._city||'';F.approx=r._approx?r._cityName:null;renderWin();$('#fAddr').value=nice;$('#sugg').style.display='none';
    $('#picked').style.display='block';$('#picked').textContent='✓ '+nice;
    try{const q=F.approx?await rpc('r_quote_approx',{t:TOKEN,p_city:F.approx,p_lat:F.lat,p_lng:F.lng}):await rpc('r_quote',{t:TOKEN,lat:F.lat,lng:F.lng});
      if(F.approx){F.lat=q.lat;F.lng=q.lng;}
      $('#fPrice').textContent=ils(q.price)+(q.fixed?' · מחיר קבוע':' · '+q.km+' ק״מ');}catch(e){toast(e.message,true);}
  }
  $('#fSearch').onclick=search;
  $('#fAddr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
  $('#fAddr').addEventListener('input',()=>{if($('#fAddr').value.trim()!==F.addr){F.lat=F.lng=null;$('#picked').style.display='none';$('#fPrice').textContent='—';}});

  /* ---- recurring addresses: one tap fills address, name and phone ---- */
  let RECENT=[];
  async function loadRecent(){
    try{RECENT=await rpc('r_recent_addresses',{t:TOKEN});}catch(e){RECENT=[];}
    $('#recentBox').style.display=RECENT.length?'block':'none';
    $('#recent').innerHTML=RECENT.map((a,i)=>`<button type="button" data-r="${i}" style="border:1.5px solid #e2e8f0;background:#fff;border-radius:20px;padding:8px 12px;font:600 14px Heebo,sans-serif;color:#334155;cursor:pointer;text-align:right">📍 ${esc(a.address.split(',')[0])}${a.name?` <span style="color:#94a3b8">· ${esc(a.name)}</span>`:''}</button>`).join('');
    $('#recent').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const a=RECENT[+b.dataset.r];
      $('#fName').value=a.name||'';$('#fPhone').value=a.phone||'';
      pick({lat:a.lat,lon:a.lng,_city:a.approx||(a.address.split(',')[1]||'').trim(),_approx:!!a.approx,_cityName:a.approx},a.address);});
  }
  loadRecent();

  $('#bookBtn').onclick=async()=>{
    unlockAudio();
    if(F.lat==null){toast('חפשו את הכתובת ובחרו מהרשימה',true);return;}
    let ws=null,we=null,readyTxt=F.ready==='עכשיו'?'עכשיו':'בעוד '+F.ready;
    if(WIN){if(!F.day||!F.win){toast('בחרו יום וחלון משלוח',true);return;}
      const [s,e]=F.win.split('-');ws=at(F.day.d,s).toISOString();we=at(F.day.d,e).toISOString();readyTxt=`${F.day.label} \u2066${s}–${e}\u2069`;}
    $('#bookBtn').disabled=true;
    try{
      await rpc('r_book_v2',{t:TOKEN,p_approx_city:F.approx||null,p_address:F.addr,p_lat:F.lat,p_lng:F.lng,p_name:$('#fName').value.trim()||null,p_phone:$('#fPhone').value.trim()||null,
        p_size:F.size,p_ready:readyTxt,p_note:$('#fNote').value.trim()||null,p_window_start:ws,p_window_end:we});
      ['#fAddr','#fName','#fPhone','#fNote'].forEach(s=>$(s).value='');F.lat=F.lng=null;F.addr='';F.city='';F.approx=null;F.win=null;renderWin();$('#picked').style.display='none';$('#fPrice').textContent='—';
      toast('השליח הוזמן · מחפש שליח');poll();loadRecent();
    }catch(e){toast(e.message,true);}
    $('#bookBtn').disabled=false;
  };

  async function poll(){
    clearTimeout(timer);
    try{
      if(!me){me=await rpc('r_me',{t:TOKEN});$('#rName0').textContent=me.name;$('#rAddr0').textContent=me.address+' · ממשק מסעדה';$('#rLogo').textContent=me.name.slice(0,1);
        if(me.settings&&/^[a-z0-9-]+\.png$/.test(me.settings.logo||'')){const L=$('#rLogo');L.textContent='';const sqr=me.settings.logo_square;L.style.cssText=sqr?'padding:0;overflow:hidden;background:#000':'width:auto;min-width:48px;padding:6px 10px;background:#e4ded2';
          const im=document.createElement('img');im.src=me.settings.logo;im.alt=me.name;im.style.cssText=sqr?'width:48px;height:48px;display:block':'height:34px;display:block';L.appendChild(im);}
        if(me.settings&&me.settings.loc_fixed===false)fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&limit=1&q='+encodeURIComponent(me.address))
          .then(r=>r.json()).then(x=>{if(x&&x[0])return rpc('r_set_location',{t:TOKEN,p_lat:+x[0].lat,p_lng:+x[0].lon});}).catch(()=>{});
        if(me.settings&&(me.settings.zones||me.settings.default_windows)){WIN=me.settings;$('#readyBox').style.display='none';$('#winBox').style.display='block';renderWin();}}
      const d=await rpc('r_orders',{t:TOKEN});
      $('#cDot').classList.toggle('on',d.courier_online);$('#cTxt').textContent=d.courier_online?'שליח זמין':'אין שליח מחובר';
      d.orders.forEach(o=>{if(last[o.id]&&last[o.id]!==o.status){toast(ST[o.status][0]);if(o.status==='to_rest'||o.status==='delivered')chime();}last[o.id]=o.status;});
      renderList(d);
    }catch(e){if(e.code==='bad_token'){gate('הקישור האישי לא תקין. בקשו קישור חדש.');return;}toast('אין חיבור לשרת',true);}
    timer=setTimeout(poll,4000);
  }
  function waLink(o){
    const page=location.origin+location.pathname.replace(/index\.html$/,'')+'p.html?k='+o.photo_key;
    const txt=`שלום${o.cust_name&&o.cust_name!=='לקוח'?' '+o.cust_name:''}, ההזמנה שלך מ${me?me.name:''} נמסרה 📦\nתמונת מסירה: ${page}`;
    let ph=String(o.cust_phone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='972'+ph.slice(1);
    return 'https://wa.me/'+(ph.length>=11?ph:'')+'?text='+encodeURIComponent(txt);
  }
  function renderList(d){
    const card=o=>{const [lab,n,c]=ST[o.status];let info;
      if(n===0)info=o.window_start&&new Date(o.window_start)-Date.now()>45*60000?'ייצא לשליח 45 דק׳ לפני החלון':d.courier_online?'נשלח לשליחים באזור':'אין שליח מחובר כרגע';
      else if(n===5)info='נמסר ב-'+hhmm(o.delivered_at);
      else{const cr=o.courier||{};let dd='';if(cr.lat){const tg=n<=2?[o.restaurant.lat,o.restaurant.lng]:[o.cust_lat,o.cust_lng];dd=' · '+km(cr.lat,cr.lng,tg[0],tg[1]).toFixed(1)+' ק״מ '+(n<=2?'מכם':'מהלקוח');}
        info=`🛵 ${esc(cr.name||'שליח')}${dd}${cr.phone?` · <a href="tel:${esc(cr.phone)}">📞</a>`:''}`;}
      return `<div class="rcard"><div class="row"><div><div class="t1">${esc(o.cust_address)}</div><div class="t2">${esc(o.cust_name||'לקוח')} · ${esc(o.size||'')} · ${o.window_start?'📅 '+esc(o.ready||''):'מוכן '+esc(o.ready||'')}</div></div><span class="chip" style="background:${c}1a;color:${c}">${lab}</span></div>
        <div class="prog">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>
        <div class="row"><span class="t2">${info}</span>${n===0?`<button class="b light sm" data-cancel="${o.id}">בטל</button>`:`<span class="t2" style="margin-inline-start:auto">${ils(o.price)}</span>`}</div>
        ${o.photo_url&&o.photo_key?`<div class="row" style="margin-top:12px;align-items:stretch"><a href="${esc(o.photo_url)}" target="_blank" rel="noopener" style="flex:none"><img src="${esc(o.photo_url)}" alt="תמונת מסירה" style="width:72px;height:72px;object-fit:cover;border-radius:12px;display:block"></a>
          <a class="b" href="${waLink(o)}" target="_blank" rel="noopener" style="background:#16a34a;color:#fff;height:auto;min-height:48px">💬 שלח ללקוח בוואטסאפ</a></div>`:''}</div>`;};
    const act=d.orders.filter(o=>o.status!=='delivered'),done=d.orders.filter(o=>o.status==='delivered');
    $('#rActive').innerHTML=act.length?act.map(card).join(''):'<div class="empty">אין משלוחים פעילים</div>';
    $('#rDone').innerHTML=done.length?done.map(card).join(''):'<div class="empty">עדיין אין</div>';
    document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{try{const ok=await rpc('r_cancel',{t:TOKEN,p_id:b.dataset.cancel});toast(ok?'המשלוח בוטל':'שליח כבר לקח את המשלוח',!ok);poll();}catch(e){toast(e.message,true);}});
  }
  if(pushOK()&&Notification.permission!=='granted'){$('#bellBtn').style.display='block';}
  $('#bellBtn').onclick=async()=>{unlockAudio();const ok=await enablePush(true);if(ok){$('#bellBtn').style.display='none';toast('התראות הופעלו');}else toast(pushErr||'לא ניתן להפעיל התראות',true);};
  enablePush(false);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll();});
  poll();
}

function gate(msg){$('#app').innerHTML=`<div class="gate"><div><div style="font-size:44px">🛵</div><b style="color:#fff;font-size:22px">משלוחים</b><br>${msg}</div></div>`;}

if(MODE==='c'&&TOKEN)courierApp();
else if(MODE==='r'&&TOKEN)restaurantApp();
else gate('פתחו את הקישור האישי שקיבלתם');
</script>
</body>
</html>
